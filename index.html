<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>until we are together</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0d070b;
      color: #ffffff;
      overflow-x: hidden;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      margin: 0;
      padding: 0;
    }

    html {
      height: -webkit-fill-available;
    }

    .font-serif-custom {
      font-family: 'Cinzel', serif;
    }

    /* Dynamic fluid typography for small screens */
    .responsive-title {
      font-size: clamp(1.75rem, 6vw, 3.75rem);
      letter-spacing: -0.02em;
    }

    /* Glassmorphism tile container */
    .glass-tile {
      background: rgba(18, 12, 16, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.47);
    }

    /* Custom scrollbar reset */
    ::-webkit-scrollbar {
      display: none;
    }

    /* Dark Floral Pattern Canvas */
    #floral-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Subtle ambient dark vignette */
    .vignette-overlay {
      background: radial-gradient(circle at center, rgba(13, 7, 11, 0.2) 0%, rgba(13, 7, 11, 0.85) 100%);
    }

    /* Tile responsive layout styling */
    .timer-tile {
      flex: 1 1 0;
      min-width: 68px;
      max-width: 130px;
    }

    .digit-number {
      font-size: clamp(1.75rem, 7vw, 3.5rem);
      line-height: 1;
    }

    .digit-label {
      font-size: clamp(0.65rem, 2vw, 0.85rem);
      letter-spacing: 0.15em;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen relative select-none antialiased">

  <!-- Background Floral Canvas -->
  <canvas id="floral-bg"></canvas>

  <!-- Vignette Darkener -->
  <div class="vignette-overlay absolute inset-0 z-10 pointer-events-none"></div>

  <!-- Main Countdown Container -->
  <main class="relative z-20 w-full max-w-4xl px-4 py-8 mx-auto flex flex-col items-center justify-center text-center my-auto">
    
    <!-- Title -->
    <h1 class="font-serif-custom responsive-title text-white font-normal mb-8 sm:mb-12 tracking-wide drop-shadow-lg opacity-95">
      until we are together
    </h1>

    <!-- Countdown Tiles Row -->
    <div class="flex flex-row items-center justify-center gap-2 sm:gap-4 md:gap-6 w-full max-w-2xl mb-8 sm:mb-10 px-1">
      
      <!-- Days -->
      <div class="timer-tile glass-tile rounded-xl sm:rounded-2xl p-3 sm:p-5 flex flex-col items-center justify-center transition-transform duration-300">
        <span id="days" class="digit-number font-bold text-white font-mono tracking-tight">00</span>
        <span class="digit-label font-medium text-gray-300 uppercase mt-2">DAYS</span>
      </div>

      <!-- Hours -->
      <div class="timer-tile glass-tile rounded-xl sm:rounded-2xl p-3 sm:p-5 flex flex-col items-center justify-center transition-transform duration-300">
        <span id="hours" class="digit-number font-bold text-white font-mono tracking-tight">00</span>
        <span class="digit-label font-medium text-gray-300 uppercase mt-2">HOURS</span>
      </div>

      <!-- Minutes -->
      <div class="timer-tile glass-tile rounded-xl sm:rounded-2xl p-3 sm:p-5 flex flex-col items-center justify-center transition-transform duration-300">
        <span id="minutes" class="digit-number font-bold text-white font-mono tracking-tight">00</span>
        <span class="digit-label font-medium text-gray-300 uppercase mt-2">MINUTES</span>
      </div>

      <!-- Seconds -->
      <div class="timer-tile glass-tile rounded-xl sm:rounded-2xl p-3 sm:p-5 flex flex-col items-center justify-center transition-transform duration-300">
        <span id="seconds" class="digit-number font-bold text-white font-mono tracking-tight">00</span>
        <span class="digit-label font-medium text-gray-300 uppercase mt-2">SECONDS</span>
      </div>

    </div>

    <!-- Total Seconds Display -->
    <div class="inline-flex items-center justify-center px-5 py-2 rounded-full glass-tile border border-white/10">
      <span id="total-seconds-container" class="text-xs sm:text-sm font-mono tracking-widest text-gray-200">
        [ <span id="total-seconds">0</span> SECONDS ]
      </span>
    </div>

  </main>

  <script>
    // Target Date: October 1, 2026 at 15:30 Zurich time (CEST / UTC+2)
    const TARGET_DATE = new Date('2026-10-01T15:30:00+02:00').getTime();

    const daysEl = document.getElementById('days');
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');
    const totalSecondsEl = document.getElementById('total-seconds');

    function padZero(num) {
      return num < 10 ? `0${num}` : num;
    }

    function updateTimer() {
      const now = new Date().getTime();
      const distance = TARGET_DATE - now;

      if (distance < 0) {
        daysEl.textContent = '00';
        hoursEl.textContent = '00';
        minutesEl.textContent = '00';
        secondsEl.textContent = '00';
        totalSecondsEl.textContent = '0';
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);
      const totalSeconds = Math.floor(distance / 1000);

      daysEl.textContent = padZero(days);
      hoursEl.textContent = padZero(hours);
      minutesEl.textContent = padZero(minutes);
      secondsEl.textContent = padZero(seconds);
      totalSecondsEl.textContent = totalSeconds.toLocaleString();
    }

    // Run timer immediately and update every second
    updateTimer();
    setInterval(updateTimer, 1000);

    // Canvas rendering for Procedural Dark Floral Pattern
    const canvas = document.getElementById('floral-bg');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      drawFloralPattern();
    }

    function drawFlower(x, y, radius, petColor, centerColor) {
      const numPetals = 6;
      ctx.save();
      ctx.translate(x, y);

      // Draw Petals
      for (let i = 0; i < numPetals; i++) {
        const angle = (i * Math.PI * 2) / numPetals;
        ctx.beginPath();
        ctx.rotate(angle);
        ctx.ellipse(radius * 0.8, 0, radius * 0.7, radius * 0.4, 0, 0, Math.PI * 2);
        ctx.fillStyle = petColor;
        ctx.fill();
        ctx.lineWidth = 0.5;
        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.stroke();
      }

      // Draw Flower Center
      ctx.beginPath();
      ctx.arc(0, 0, radius * 0.35, 0, Math.PI * 2);
      ctx.fillStyle = centerColor;
      ctx.fill();

      ctx.restore();
    }

    function drawLeaves(x, y, angle) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.beginPath();
      ctx.ellipse(15, 0, 18, 6, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#1e101a';
      ctx.fill();
      ctx.restore();
    }

    function drawFloralPattern() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Base dark fill
      ctx.fillStyle = '#0d070b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Procedural floral cluster placement
      const seed = 42;
      const clusters = [
        // Top Left
        { x: canvas.width * 0.08, y: canvas.height * 0.12, r: 28, color: '#8b1e2d' },
        { x: canvas.width * 0.15, y: canvas.height * 0.22, r: 22, color: '#5b1f48' },
        { x: canvas.width * 0.04, y: canvas.height * 0.35, r: 32, color: '#a32838' },
        // Top Right
        { x: canvas.width * 0.92, y: canvas.height * 0.1, r: 30, color: '#a32838' },
        { x: canvas.width * 0.82, y: canvas.height * 0.2, r: 24, color: '#6a1b52' },
        { x: canvas.width * 0.95, y: canvas.height * 0.32, r: 26, color: '#8b1e2d' },
        // Bottom Left
        { x: canvas.width * 0.06, y: canvas.height * 0.82, r: 34, color: '#a32838' },
        { x: canvas.width * 0.16, y: canvas.height * 0.9, r: 25, color: '#5b1f48' },
        { x: canvas.width * 0.02, y: canvas.height * 0.68, r: 22, color: '#7a1a31' },
        // Bottom Right
        { x: canvas.width * 0.9, y: canvas.height * 0.85, r: 32, color: '#8b1e2d' },
        { x: canvas.width * 0.8, y: canvas.height * 0.78, r: 22, color: '#6a1b52' },
        { x: canvas.width * 0.96, y: canvas.height * 0.68, r: 28, color: '#a32838' },
      ];

      // Draw Vine Connection Branches
      ctx.strokeStyle = '#22111d';
      ctx.lineWidth = 2;
      clusters.forEach((item, index) => {
        drawLeaves(item.x - 10, item.y - 10, index);
        drawLeaves(item.x + 15, item.y + 10, index + 1);
        drawFlower(item.x, item.y, item.r, item.color, '#d89a42');
      });

      // Subtle Background Stars / Dust
      ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
      for (let i = 0; i < 45; i++) {
        const sx = Math.sin(i * 99) * canvas.width * 0.5 + canvas.width * 0.5;
        const sy = Math.cos(i * 33) * canvas.height * 0.5 + canvas.height * 0.5;
        const sSize = (i % 3) * 0.8 + 0.5;
        ctx.beginPath();
        ctx.arc(sx, sy, sSize, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
  </script>
</body>
</html>
